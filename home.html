<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometric Code Slicer</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <!-- Container -->
    <div
      class="w-full max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg text-center relative"
    >
      <!-- Header Section with Logo and About Us Button -->
      <div class="flex items-center justify-between mb-6">
        <!-- Logo Button (Top Left) -->
      <a href = "home.html">
        <button class="ml-8">
          <img
            src="Logo.png"
            class="w-24 h-auto"
            style="transform: scale(2.5)"
            alt="Logo"
          />
        </button>
      </a>

        <!-- About Us Button (Top Right) -->

        <a href = "about.html">
          <button
            class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md shadow-md"
          >
            About Us
          </button>
        </div></a>

      <!-- Upload Box -->
      <div
        class="border-2 border-dashed border-gray-400 bg-blue-50 p-8 rounded-lg flex gap-4 mb-12 flex-col items-center cursor-pointer"
        onclick="document.getElementById('fileInput').click()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-12 w-12 text-gray-400 mb-2"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          />
        </svg>
        <p class="text-gray-500">Upload Geometric Code Here</p>
        <!-- Hidden File Input for Uploading -->
        <input
          type="file"
          id="fileInput"
          class="hidden"
          onchange="handleFileUpload(event)"
        />
      </div>

      <!-- Slice Button -->
      <button
        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md shadow-md mb-4"
      >
        Slice G-Code
      </button>
    </div>

    <script>
      function handleFileUpload(event) {
        const file = event.target.files[0];
        if (file) {
          alert(`File "${file.name}" selected successfully!`);
          // Add further processing code here as needed
        } else {
          alert("No file selected.");
        }
      }
    </script>
  </body>
</html>
