<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometric Code Slicer</title>
    <!-- Import Source Code Pro Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Apply Source Code Pro font to all text */
      body {
        font-family: "Source Code Pro", monospace;
      }
      /* Loading bar styling */
      .loading-bar {
        width: 80%;
        height: 8px;
        background-color: #e0e0e0;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      .loading-bar::before {
        content: "";
        position: absolute;
        width: 50%;
        height: 100%;
        background-color: #3498db;
        animation: loading 1.5s infinite;
        border-radius: 4px;
      }
      @keyframes loading {
        0% {
          left: -50%;
        }
        50% {
          left: 100%;
        }
        100% {
          left: -50%;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <!-- Container -->
    <div
      class="w-full max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg text-center relative"
    >
      <!-- Header Section with Logo and About Us Button -->
      <div class="flex items-center justify-between mb-6">
        <!-- Logo Button (Top Left) -->
        <a href="home.html">
          <button class="ml-8">
            <img
              src="Logo.png"
              class="w-24 h-auto"
              style="transform: scale(2.5)"
              alt="Logo"
            />
          </button>
        </a>

        <!-- About Us Button (Top Right) -->
        <a href="about.html">
          <button
            class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md shadow-md"
          >
            About Us
          </button>
        </a>
      </div>

      <!-- Upload Box -->
      <div
        id="uploadBox"
        class="border-2 border-dashed border-gray-400 bg-blue-50 p-8 rounded-lg flex gap-4 mb-12 flex-col items-center cursor-pointer"
        onclick="document.getElementById('fileInput').click()"
      >
        <!-- Downsign Image and Loading Bar -->
        <img
          id="downsignIcon"
          src="downsign.png"
          class="h-12 w-12 mb-2"
          alt="Downsign"
        />

        <!-- Loading Bar (Hidden Initially) -->
        <div id="loadingBar" class="loading-bar hidden"></div>

        <!-- Text with Source Code Pro Font -->
        <p id="uploadText" class="text-gray-500">Upload Geometric Code Here</p>

        <!-- Hidden File Input for Uploading -->
        <input
          type="file"
          id="fileInput"
          class="hidden"
          onchange="handleFileUpload(event)"
        />
      </div>

      <!-- Slice Button -->
      <button
        onclick="sliceGCode()"
        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md shadow-md mb-4"
      >
        Slice G-Code
      </button>

      <!-- Download Links Container -->
      <div id="downloadLinks" class="mt-4 hidden">
        <p>Download your processed files:</p>
        <a
          id="downloadObj"
          class="text-blue-500 underline block mt-2"
          download="model.obj"
          >Download 3D Model (.obj)</a
        >
        <a
          id="downloadGif"
          class="text-blue-500 underline block mt-2"
          download="model_animation.gif"
          >Download Animation (.gif)</a
        >
      </div>
    </div>

    <script>
      let uploadedFile = null;

      function handleFileUpload(event) {
        uploadedFile = event.target.files[0];
        const uploadText = document.getElementById("uploadText");

        if (uploadedFile) {
          uploadText.textContent = `File Uploaded: ${uploadedFile.name}`;
        } else {
          uploadText.textContent = "No file selected.";
        }
      }

      function sliceGCode() {
        if (!uploadedFile) {
          alert("Please upload a file first.");
          return;
        }

        // Show the loading bar and hide the downsign icon
        document.getElementById("downsignIcon").classList.add("hidden");
        document.getElementById("loadingBar").classList.remove("hidden");

        // Create a FormData object to send the file
        const formData = new FormData();
        formData.append("file", uploadedFile);

        // Send file to the backend
        fetch("http://localhost:5000/upload", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.obj && data.gif) {
              // Create Blob URLs for .obj and .gif files
              const objBlob = new Blob([data.obj], {
                type: "application/octet-stream",
              });
              const gifBlob = new Blob([data.gif], { type: "image/gif" });
              const objUrl = URL.createObjectURL(objBlob);
              const gifUrl = URL.createObjectURL(gifBlob);

              // Display download links and assign Blob URLs to links
              const downloadLinks = document.getElementById("downloadLinks");
              document.getElementById("downloadObj").href = objUrl;
              document.getElementById("downloadGif").href = gifUrl;
              downloadLinks.classList.remove("hidden");

              // Hide loading bar
              document.getElementById("loadingBar").classList.add("hidden");
            } else {
              throw new Error("File processing failed");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Failed to process the file. Please try again.");
            // Reload the page if there's an error
            location.reload();
          });
      }
    </script>
  </body>
</html>
